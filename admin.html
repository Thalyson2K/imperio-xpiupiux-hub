<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Império XPiuPiuX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">
    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-gray-800/80">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-red-600 flex items-center justify-center glow-amber"><i class="fa-solid fa-crown text-black text-xl font-extrabold"></i></div>
            <div><span class="font-gamer text-2xl font-black tracking-wider text-amber-400">PAINEL GUILD MASTER</span><span class="block text-[10px] text-gray-400 font-semibold tracking-widest uppercase">Gestão Absoluta de Membros</span></div>
        </div>
        <div id="header-nav" class="flex space-x-6 text-sm font-semibold"></div>
    </nav>

    <main class="container mx-auto p-6 max-w-6xl space-y-6">
        <div class="glass-panel rounded-2xl p-6 shadow-2xl">
            <h2 class="font-gamer text-xl font-bold text-amber-400 mb-4 flex items-center border-b border-gray-800 pb-3"><i class="fa-solid fa-user-clock mr-2 text-amber-400"></i> Solicitações Pendentes de Entrada</h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-sm text-gray-300"><thead class="bg-gray-900/90 uppercase text-xs text-amber-400 font-gamer font-bold"><tr><th class="p-3">Nick</th><th class="p-3">Classe</th><th class="p-3">E-mail</th><th class="p-3">Data</th><th class="p-3 text-center">Ação</th></tr></thead><tbody id="tabela-pendentes" class="divide-y divide-gray-800"></tbody></table></div>
        </div>

        <div class="glass-panel rounded-2xl p-6 shadow-2xl border-red-500/20">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3"><h2 class="font-gamer text-xl font-bold text-red-400 flex items-center"><i class="fa-solid fa-users-gear mr-2 text-red-500"></i> Membros Aprovados & Controle de Acesso</h2><button type="button" onclick="carregarMembrosGestao()" class="text-xs bg-gray-900 hover:bg-gray-800 text-gray-300 font-bold px-3 py-1.5 rounded-xl border border-gray-700 transition"><i class="fa-solid fa-rotate-right mr-1"></i> Atualizar Tabela</button></div>
            <div class="overflow-x-auto"><table class="w-full text-left text-sm text-gray-300"><thead class="bg-gray-900/90 uppercase text-xs text-amber-400 font-gamer font-bold"><tr><th class="p-3">Membro / Nick</th><th class="p-3">Classe</th><th class="p-3">Cargo</th><th class="p-3">Status</th><th class="p-3 text-center">Radar VIP</th><th class="p-3 text-center">Moderação GM</th></tr></thead><tbody id="tabela-membros-gestao" class="divide-y divide-gray-800"></tbody></table></div>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const usuario = typeof obterUsuarioLogado === 'function' ? obterUsuarioLogado() : null;
        if (!usuario || !usuario.is_admin) {
          alert('⛔ Acesso Negado! Esta área é exclusiva para o Administrador.');
          window.location.href = 'admin-login.html';
          return;
        }
        carregarPendentes();
        carregarMembrosGestao();
      });
    </script>
</body>
</html>
