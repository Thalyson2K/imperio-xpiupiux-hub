<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bater Ponto - Império XPiuPiuX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

    <nav class="bg-gray-900 border-b border-red-900/40 px-6 py-4 flex justify-between items-center shadow-lg">
        <span class="text-xl font-extrabold text-red-500">IMPÉRIO XPIUPIUX - CHECK-IN</span>
        <div id="header-nav" class="flex space-x-6 text-sm font-semibold"></div>
    </nav>

    <div class="container mx-auto p-6 max-w-lg">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-bold text-amber-400 mb-4 text-center">
                <i class="fa-solid fa-calendar-check mr-2"></i> Bater Ponto no Evento
            </h2>

            <form id="form-ponto" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Seu Nick (No Jogo):</label>
                    <input type="text" id="nick" required placeholder="Ex: Wiloow_BK" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Evento / Raid:</label>
                    <select id="evento-nome" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                        <option value="Castle Siege">Castle Siege</option>
                        <option value="Kill de Kundun">Raid de Kundun (Kalima 7)</option>
                        <option value="Blood Castle Raid">Blood Castle Guild Raid</option>
                        <option value="Treino de Guild">Treino de Guild</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Senha da Chamada (fornecida pelo GM):</label>
                    <input type="password" id="codigo-evento" required placeholder="Digite o código" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-bold py-2 rounded transition shadow-lg">
                    Confirmar Presença
                </button>
            </form>

            <div id="mensagem" class="mt-4 text-center text-sm hidden"></div>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/session.js"></script>
    <script src="js/presenca.js"></script>
</body>
</html>
