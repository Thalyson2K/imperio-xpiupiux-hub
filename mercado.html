<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar VIP de Desejos - Império XPiuPiuX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-gray-800/80">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 via-amber-500 to-yellow-400 flex items-center justify-center glow-amber">
                <i class="fa-solid fa-crosshairs text-black text-xl font-black"></i>
            </div>
            <div>
                <span class="font-gamer text-2xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-red-500 to-amber-300 bg-clip-text text-transparent">RADAR VIP DE DESEJOS</span>
                <span class="block text-[10px] text-gray-400 font-semibold tracking-widest uppercase">Caçador de Ofertas Mu Lotus</span>
            </div>
        </div>
        <div id="header-nav" class="flex space-x-6 text-sm font-semibold"></div>
    </nav>

    <div id="caixa-notificacao-topo" class="hidden bg-amber-500/10 border-b border-amber-500/30 px-6 py-3 text-amber-300 text-sm flex justify-between items-center backdrop-blur-md sticky top-[73px] z-40">
        <div class="flex items-center space-x-3"><i class="fa-solid fa-crosshairs text-amber-400 animate-bounce text-xl"></i><span id="texto-notificacao" class="font-semibold"></span></div>
        <button onclick="document.getElementById('caixa-notificacao-topo').classList.add('hidden')" class="text-xs bg-amber-950/80 px-3 py-1 rounded-lg border border-amber-700/50 hover:bg-amber-900 transition">Fechar Alerta</button>
    </div>

    <main class="flex-1 container mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="space-y-6">
            <div class="glass-panel rounded-2xl p-5 shadow-2xl border-amber-500/20">
                <h2 class="font-gamer text-xl font-extrabold text-amber-400 mb-3 border-b border-gray-800 pb-2 flex items-center"><i class="fa-solid fa-crosshairs mr-2 text-red-500"></i> Configurar Novo Radar</h2>
                <p class="text-xs text-gray-400 mb-4">Cadastre o item que deseja comprar no Mu Lotus. O Radar avisa assim que ele aparecer no site!</p>
                <form id="form-radar-desejo" class="space-y-3">
                    <div><label class="block text-xs font-bold uppercase text-gray-300 mb-1">Item Desejado (Nome/Palavra)</label><input type="text" id="radar-termo" required placeholder="Ex: Wing of Dragon, Kundun Staff" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-amber-500 transition"></div>
                    <div><label class="block text-xs font-bold uppercase text-gray-300 mb-1">Moeda Alvo</label><select id="radar-moeda" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-amber-400 font-bold text-xs"><option value="Qualquer">Qualquer Moeda</option><option value="WC">🟡 WC (WCoins)</option><option value="HP">🟣 HP (Hunt Points)</option><option value="CREDITOS">🟢 Créditos Web</option><option value="ZEN">🟡 Zen</option></select></div>
                    <div><label class="block text-xs font-bold uppercase text-gray-300 mb-1">Valor Máximo Tolerado</label><input type="number" id="radar-preco" placeholder="Ex: 500 (Deixe limpo para qualquer valor)" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-amber-500 transition"></div>
                    <button type="submit" class="w-full bg-gradient-to-r from-amber-600 via-red-600 to-amber-500 hover:from-amber-700 hover:to-red-700 text-black font-extrabold py-3 rounded-xl transition shadow-lg glow-amber uppercase text-xs tracking-wider"><i class="fa-solid fa-crosshairs mr-1"></i> Ativar Radar de Caça</button>
                </form>
            </div>
            <div class="glass-panel rounded-2xl p-5 shadow-2xl">
                <h3 class="font-gamer text-lg font-bold text-gray-200 mb-3 border-b border-gray-800 pb-2 flex justify-between items-center"><span>Radars Ativos</span><span id="total-radars" class="text-xs bg-amber-950 text-amber-400 border border-amber-700/50 px-2 py-0.5 rounded-lg">0</span></h3>
                <div id="lista-radars-ativos" class="space-y-2 max-h-64 overflow-y-auto"></div>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-4">
            <div class="glass-panel rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex flex-col sm:flex-row items-start sm:items-center space-y-1 sm:space-y-0 sm:space-x-3">
                    <h2 class="font-gamer text-xl font-bold text-white tracking-wider uppercase">Achados no Radar (mulotus.net)</h2>
                    <div id="status-scanner-mulotus" class="text-xs bg-gray-950 px-2.5 py-1 rounded-lg border border-gray-800"><span class="text-amber-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Conectando ao MuLotus...</span></div>
                </div>
                <div class="flex space-x-2">
                    <button onclick="escanearMercadoMuLotus()" class="text-xs bg-gradient-to-r from-amber-600 to-amber-500 text-black font-extrabold px-3 py-2 rounded-xl shadow-lg hover:from-amber-700 hover:to-amber-600 transition flex items-center space-x-1"><i class="fa-solid fa-arrows-rotate mr-1"></i><span>Sincronizar Agora</span></button>
                    <button onclick="solicitarPermissaoNotificacao()" class="text-xs bg-gray-900 hover:bg-gray-800 text-amber-400 font-bold px-3 py-2 rounded-xl border border-gray-700 transition flex items-center space-x-1.5"><i class="fa-solid fa-bell text-amber-400"></i><span>Alerta Sonoro</span></button>
                </div>
            </div>
            <div id="grid-achados-radar" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/session.js"></script>
    <script src="js/config.js"></script>
    <script src="js/mercado.js"></script>
</body>
</html>
