<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Radar VIP - Império XPiuPiuX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-gray-800/80">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-red-600 flex items-center justify-center glow-amber">
                <i class="fa-solid fa-store text-black text-xl font-black"></i>
            </div>
            <div>
                <span class="font-gamer text-2xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-red-500 to-purple-400 bg-clip-text text-transparent">MERCADO RADAR VIP</span>
                <span class="block text-[10px] text-gray-400 font-semibold tracking-widest uppercase">Mu Lotus Market Hub</span>
            </div>
        </div>
        <div id="header-nav" class="flex space-x-6 text-sm font-semibold"></div>
    </nav>

    <div id="caixa-notificacao-topo" class="hidden bg-amber-500/10 border-b border-amber-500/30 px-6 py-3 text-amber-300 text-sm flex justify-between items-center backdrop-blur-md">
        <div class="flex items-center space-x-3"><i class="fa-solid fa-bell text-amber-400 animate-bounce text-lg"></i><span id="texto-notificacao" class="font-semibold"></span></div>
        <button onclick="document.getElementById('caixa-notificacao-topo').classList.add('hidden')" class="text-xs bg-amber-950/80 px-3 py-1 rounded-lg border border-amber-700/50 hover:bg-amber-900 transition">Fechar</button>
    </div>

    <main class="flex-1 container mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="space-y-6">
            <div class="glass-panel rounded-2xl p-5 shadow-2xl">
                <h2 class="font-gamer text-xl font-extrabold text-amber-400 mb-4 border-b border-gray-800 pb-2 flex items-center"><i class="fa-solid fa-cart-plus mr-2 text-red-500"></i> Anunciar Item no Radar</h2>
                <form id="form-postar-item" class="space-y-3">
                    <div><label class="block text-xs font-bold uppercase text-gray-400 mb-1">Nome do Item</label><input type="text" id="post-nome" required placeholder="Ex: Wing of Dragon +11 +L +16" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-red-500 transition"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-xs font-bold uppercase text-gray-400 mb-1">Categoria</label><select id="post-categoria" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-white text-xs"><option>Asas / AZA</option><option>Armas / Swords</option><option>Sets / Armaduras</option><option>Escudos / Shields</option><option>Joias / Gems</option><option>Anéis e Pendentes</option><option>Pets & Montarias</option><option>Outros</option></select></div>
                        <div><label class="block text-xs font-bold uppercase text-gray-400 mb-1">Moeda</label><select id="post-moeda" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-amber-400 font-bold text-xs"><option value="WC">WC (WCoins)</option><option value="HP">HP (Hunt Points)</option><option value="CREDITOS">Créditos Web</option><option value="ZEN">Zen</option><option value="PACK_BLESS">Pack de Bless</option><option value="PACK_SOUL">Pack de Soul</option><option value="CHAOS_LIFE">Jewel of Chaos/Life</option><option value="TROCA_ITEM">Troca Direta</option></select></div>
                    </div>
                    <div><label class="block text-xs font-bold uppercase text-gray-400 mb-1">Preço / Condição de Troca</label><input type="text" id="post-preco" required placeholder="Ex: 500 ou Troco por BK Item" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-amber-500 transition"></div>
                    <div><label class="block text-xs font-bold uppercase text-gray-400 mb-1">Contato do Vendedor</label><input type="text" id="post-vendedor" placeholder="Ex: Wiloow_BK (Discord)" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-red-500 transition"></div>
                    <button type="submit" class="w-full bg-gradient-to-r from-red-600 via-amber-600 to-yellow-500 hover:from-red-700 hover:to-yellow-600 text-black font-extrabold py-3 rounded-xl transition shadow-lg glow-amber uppercase text-xs tracking-wider"><i class="fa-solid fa-paper-plane mr-1"></i> Publicar Oferta no Radar</button>
                </form>
            </div>

            <div class="glass-panel rounded-2xl p-5 shadow-2xl">
                <h2 class="font-gamer text-xl font-extrabold text-amber-400 mb-3 border-b border-gray-800 pb-2 flex items-center"><i class="fa-solid fa-bell mr-2 text-amber-400"></i> Meus Alertas de Compra</h2>
                <form id="form-favorito" class="space-y-3 mb-4"><input type="text" id="fav-termo" required placeholder="Termo (Ex: Wing, Kundun)" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2 text-white text-xs"><select id="fav-moeda" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2 text-white text-xs"><option value="Qualquer">Qualquer Moeda</option><option value="WC">WC (WCoins)</option><option value="HP">HP (Hunt Points)</option><option value="CREDITOS">Créditos Web</option><option value="ZEN">Zen</option><option value="JOIAS">Joias</option></select><input type="number" id="fav-preco" placeholder="Preço máximo" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl p-2 text-white text-xs"><button type="submit" class="w-full bg-gray-800 hover:bg-gray-700 text-amber-400 font-bold py-2 rounded-xl text-xs border border-gray-700 transition">+ Criar Alerta VIP</button></form>
                <div id="lista-favoritos" class="space-y-2 max-h-48 overflow-y-auto"></div>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-4">
            <div class="glass-panel rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-center gap-3 border border-gray-800"><div class="flex items-center space-x-2 w-full sm:w-auto"><i class="fa-solid fa-filter text-amber-400 text-sm"></i><span class="font-gamer font-bold text-gray-300 text-sm uppercase">Filtrar por Moeda:</span></div><div id="filtro-moedas-mercado" class="flex flex-wrap gap-1.5 w-full sm:w-auto"></div></div>
            <div class="flex justify-end"><button onclick="solicitarPermissaoNotificacao()" class="text-xs bg-gray-800 hover:bg-gray-700 text-amber-400 px-3 py-1.5 rounded border border-gray-700"><i class="fa-solid fa-bell mr-1"></i> Ativar Som & Push</button></div>
            <div id="grid-mercado-cards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
        </div>
    </main>

    <script src="js/supabase.js"></script><script src="js/session.js"></script><script src="js/config.js"></script><script src="js/mercado.js"></script>
</body>
</html>
